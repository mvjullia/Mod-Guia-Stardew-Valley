<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Guia Especial Stardew Valley</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet"><style>

 img,.portrait{width:42px;height:42px;object-fit:contain;image-rendering:pixelated}.item button{border:0;background:none;text-align:left;flex:1;color:var(--ink);font-weight:900}.item small{display:block;color:#aa9477;font-weight:600;margin-top:3px}.item input{accent-color:#789d68;width:18px;height:18px}.dialog{border:1px solid #dfc9a0;border-radius:15px;padding:25px;max-width:460px;color:var(--ink);background:#fffdf4}.dialog::backdrop{background:#3e352899}.dialog p{line-height:1.6}.login{position:fixed;inset:0;background:linear-gradient(140deg,#d8ecc6,#f8e7bb);display:grid;place-items:center;z-index:10}.loginbox{width:min(480px,90vw);text-align:center;background:#fff9e8;border:4px solid #b77c44;outline:5px solid #f3d59b;border-radius:13px;padding:40px 35px;box-shadow:0 15px 0 #a56f3a55}.loginbox h1{font:16px/1.8 'Press Start 2P';color:#70502f}.loginbox p{color:#967b5f;font-size:13px}.steam{background:#263b4c;color:white;border:0;border-radius:8px;padding:14px 22px;font-weight:900;margin:14px}.link{border:0;background:none;color:#678b58;font-weight:900}.loginbox .tiny{font-size:11px;line-height:1.6}.hidden{display:none!important}a{color:#668c56}@media(max-width:800px){.sidebar{width:66px;padding:22px 8px}.brand{font-size:0;margin-bottom:30px}.brand span{font-size:25px}.navlabel,.nav button span,.sidebottom{display:none}.nav button{padding:12px;text-align:center}.nav button i{width:auto}.hero:after{opacity:.18}.grid{grid-template-columns:1fr 1fr}.items{grid-template-columns:1fr}.content{padding:25px 4%}.hero h1{font-size:16px}}@media(max-width:480px){.grid{grid-template-columns:1fr}.top small{display:none}}
</style></head><body><div id="login" class="login"><div class="loginbox"><div style="font-size:50px">🌻</div><p style="letter-spacing:2px;font-weight:900">GUIA ESPECIAL</p><h1>STARDEW<br>VALLEY</h1><p style="margin-top:28px;font:10px/1.9 'Press Start 2P'">Deseja vincular-se<br>com a Steam?</p><button class="steam" onclick="alert('O vínculo Steam ainda não está configurado. Você pode explorar o guia sem entrar.')">◉ &nbsp; Vincular com a Steam</button><br><button class="link" onclick="document.querySelector('#login').classList.add('hidden')">Explorar o guia sem entrar →</button><p class="tiny">O vínculo e a sincronização do save ainda não estão disponíveis nesta versão.</p></div></div><div class="app"><aside class="sidebar"><div class="brand"><span>🌻</span> GUIA ESPECIAL<br>STARDEW VALLEY</div><div class="navlabel">MENU PRINCIPAL</div><nav class="nav" id="nav"></nav><div class="sidebottom">🌱 <b>Um dia de cada vez.</b>Seu vale, suas histórias. Aproveite a jornada!</div></aside><main class="main"><header class="top"><small>🌿 &nbsp; Seu cantinho no Vale do Orvalho</small><button onclick="document.querySelector('#login').classList.remove('hidden')">◉ &nbsp; Vincular Steam</button></header><div class="content" id="content"></div></main></div><dialog class="dialog" id="dialog"><div id="dialogbody"></div><button class="smallbtn" onclick="document.querySelector('#dialog').close()">Fechar</button></dialog><script>
const wiki='https://pt.stardewvalleywiki.com/';const en='https://stardewvalleywiki.com/';const tabs=[['home','🏡','Fazendeiro(a)'],['center','🌳','Centro Comunitário'],['gifts','🎁','Amizade']];let current='home';let checked=JSON.parse(localStorage.getItem('guia-checks')||'{}');let filter='Todos';let query='';const groups={ 'Coleta da primavera':['Raiz-forte','Narciso','Alho-poró','Dente-de-leão'], 'Coleta do verão':['Uva','Fruta de especiaria','Ervilha-de-cheiro'], 'Coleta do outono':['Cogumelo comum','Ameixa selvagem','Avelã','Amora'], 'Coleta do inverno':['Raiz de inverno','Fruta de cristal','Inhame de neve','Açafrão'], 'Construção':['Madeira (99)','Madeira (99)','Pedra (99)','Madeira de lei (10)'], 'Cultivo da primavera':['Chirívia','Vagem','Couve-flor','Batata'], 'Cultivo do verão':['Tomate','Pimenta','Mirtilo','Melão'], 'Cultivo do outono':['Milho','Berinjela','Abóbora','Inhame'], 'Cultivos de qualidade':['Chirívia ouro (5)','Melão ouro (5)','Abóbora ouro (5)','Milho ouro (5)'], 'Animais':['Leite grande','Ovo grande marrom','Ovo grande branco','Leite grande de cabra','Lã','Ovo de pata'], 'Artesão':['Óleo de trufa','Tecido','Queijo de cabra','Queijo','Mel','Geleia','Maçã','Damasco','Laranja','Pêssego','Romã','Cereja'], 'Peixes do rio':['Peixe-lua','Bagre','Sável','Peixe-tigre'], 'Peixes do lago':['Achigã','Carpa','Peixe-gato','Esturjão'], 'Peixes do oceano':['Sardinha','Atum','Pargo','Tilápia'], 'Pesca noturna':['Olho-de-vidro','Dourada','Enguia'], 'Covos':['Lagosta','Lagostim','Caranguejo','Berbigão','Mexilhão','Camarão','Caracol','Caramujo','Ostra','Marisco'], 'Peixes especiais':['Baiacu','Peixe-fantasma','Peixe da areia','Peixe de madeira'], 'Ferreiro':['Barra de cobre','Barra de ferro','Barra de ouro'], 'Geólogo':['Quartzo','Cristal da terra','Lágrima congelada','Quartzo de fogo'], 'Aventureiro':['Gosma (99)','Asa de morcego (10)','Essência solar','Essência nula'], 'Chefe de cozinha':['Xarope de bordo','Samambaia','Trufa','Papoula','Enroladinho de papoula','Ovo frito'], 'Tintura':['Cogumelo vermelho','Ouriço-do-mar','Girassol','Pena de pato','Água-marinha','Repolho roxo'], 'Pesquisa de campo':['Cogumelo roxo','Concha de náutilo','Cacho','Geodo congelado'], 'Ração':['Trigo (10)','Feno (10)','Maçã (3)'], 'Encomenda':['Resina de carvalho','Vinho','Pé de coelho','Romã'], 'Cofre':['2.500 ouros','5.000 ouros','10.000 ouros','25.000 ouros']};const need={'Cultivos de qualidade':'Escolha 3 dos 4; cada entrega exige 5 itens de qualidade ouro.','Animais':'Escolha 5 dos 6.','Artesão':'Escolha 6 dos 12.','Covos':'Escolha 5 dos 10.','Aventureiro':'Escolha 2 dos 4.','Cofre':'Doe um total de 42.500 ouros.'};const english={'Raiz-forte':'Wild Horseradish','Narciso':'Daffodil','Alho-poró':'Leek','Dente-de-leão':'Dandelion','Uva':'Grape','Fruta de especiaria':'Spice Berry','Ervilha-de-cheiro':'Sweet Pea','Cogumelo comum':'Common Mushroom','Ameixa selvagem':'Wild Plum','Avelã':'Hazelnut','Amora':'Blackberry','Raiz de inverno':'Winter Root','Fruta de cristal':'Crystal Fruit','Inhame de neve':'Snow Yam','Açafrão':'Crocus','Chirívia':'Parsnip','Vagem':'Green Bean','Couve-flor':'Cauliflower','Batata':'Potato','Tomate':'Tomato','Pimenta':'Hot Pepper','Mirtilo':'Blueberry','Melão':'Melon','Milho':'Corn','Berinjela':'Eggplant','Abóbora':'Pumpkin','Inhame':'Yam','Repolho roxo':'Red Cabbage'};function img(name){let n=english[name]||name;return 'https://stardewvalleywiki.com/mediawiki/images/thumb/'+''}function icon(name){return `<img alt="" src="https://stardewvalleywiki.com/Special:Redirect/file/${encodeURIComponent((english[name]||name)+'.png')}" onerror="this.outerHTML='🌱'">`}function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function nav(){document.querySelector('#nav').innerHTML=tabs.map(([id,ico,n])=>`<button class="${current===id?'active':''}" onclick="go('${id}')"><i>${ico}</i><span>${n}</span></button>`).join('')}function go(id){current=id;nav();render();window.scrollTo(0,0)}function head(){return ''}function render(){let el=document.querySelector('#content');if(current==='home'){el.innerHTML='<div id="saveinfo" class="farmer-profile" role="region" aria-label="Perfil do jogador">Aguardando a fazenda no jogo.</div>';if(window.guiaData)showFarmerSnapshot(window.guiaData);return}if(current==='center'){let total=Object.values(groups).flat().length, done=Object.keys(checked).filter(k=>checked[k]).length;el.innerHTML=head('CENTRO COMUNITÁRIO','Um vale mais unido','Um checklist para os pacotes normais. Marque suas entregas e planeje cada estação.')+`<div class="sectionhead"><div><h2>Seu progresso</h2><p>${done} de ${total} opções marcadas · alguns pacotes exigem apenas parte dos itens</p></div><span class="badge">Salvo neste navegador</span></div><div class="progress"><div style="width:${Math.min(100,done/total*100)}%"></div></div><div class="toolbar"><input placeholder="🔎  Buscar um item ou pacote..." value="${esc(query)}" oninput="query=this.value;renderCenterList()"><button onclick="if(confirm('Limpar todas as marcações?')){checked={};localStorage.setItem('guia-checks','{}');render()}">Limpar</button></div><div id="list"></div>`;renderCenterList();return}if(current==='gifts'){let names=['Abigail','Alex','Caroline','Clint','Demetrius','Elliott','Emily','Evelyn','George','Gus','Haley','Harvey','Jas','Jodi','Kent','Krobus','Leah','Lewis','Linus','Marnie','Maru','Pam','Penny','Pierre','Robin','Sam','Sandy','Sebastian','Shane','Vincent','Willy','Wizard','Dwarf','Leo'];el.innerHTML=head('PRESENTES','Cultive amizades','Conheça os moradores do vale e encontre os presentes que fazem seus dias mais felizes.')+`<div class="sectionhead"><div><h2>Moradores do vale</h2><p>Suas histórias começam com uma boa conversa.</p></div></div><div class="grid">${names.map(n=>`<div class="card" style="display:flex;align-items:center;gap:14px"><img class="portrait" src="https://stardewvalleywiki.com/Special:Redirect/file/${n}.png" onerror="this.outerHTML='👤'" alt=""><div><h3 style="margin:0">${n}</h3><a style="font-size:12px" target="_blank" href="${en}${n}">Ver presentes favoritos ↗</a></div></div>`).join('')}</div>`;return}if(current==='wiki'){el.innerHTML=head('ENCICLOPÉDIA','Toda a sabedoria do vale','Explore a Wiki oficial em português para encontrar informações sobre o jogo.')+`<div class="sectionhead"><div><h2>Explore a Wiki</h2><p>Guias, personagens, itens e muito mais.</p></div></div><div class="grid">${[['🌾','Cultivos','Cultivos'],['🐟','Peixes','Peixes'],['🏘️','Habitantes','Habitantes'],['⛏️','Minas','Minas'],['🎒','Itens','Itens'],['📚','Página inicial','Stardew_Valley_Wiki']].map(x=>`<div class="card"><div class="icon">${x[0]}</div><h3>${x[1]}</h3><a target="_blank" href="${wiki}${encodeURIComponent(x[2])}">Abrir na Wiki ↗</a></div>`).join('')}</div>`;return}let data={fishing:['🎣','Pescaria','Vara de irídio avançada, receita de isca de desafio e baús de tesouro dourados.'],foraging:['🌿','Coleta','Receitas da semente de árvore mística e do totem do tesouro, além de caixas misteriosas douradas.'],farming:['🌾','Cultivo','Foice de irídio, receita da estátua das bênçãos e possibilidade de encontrar biscoitos dourados para animais.'],mining:['⛏️','Mineração','Receitas da estátua do rei anão e da fornalha pesada; pedras com gemas passam a render o dobro.'],combat:['⚔️','Combate','Receitas da bigorna e da miniforja, além de um espaço de equipamento para bugigangas.']}[current];el.innerHTML=head('MAESTRIAS',data[1], 'Aperfeiçoe suas habilidades e descubra novas recompensas na Caverna da Maestria.')+`<div class="sectionhead"><div><h2>${data[0]} Maestria de ${data[1]}</h2><p>Uma nova etapa para quem domina as cinco habilidades.</p></div></div><div class="panel"><h3>Recompensas</h3><p style="line-height:1.7">${data[2]}</p><a href="${en}Mastery_Cave" target="_blank">Ver todos os detalhes na Wiki ↗</a></div><div class="notice">⭐ Para entrar na caverna, alcance nível 10 nas cinco habilidades. Depois disso, a experiência acumulada contribui para a maestria; os cinco níveis custam 10.000, 15.000, 20.000, 25.000 e 30.000 pontos, respectivamente. Você escolhe a ordem das recompensas.</div>`}function renderCenterList(){let target=document.querySelector('#list');if(!target)return;target.innerHTML=Object.entries(groups).map(([g,arr])=>{let items=arr.map((n,i)=>({n,i})).filter(x=>(g+' '+x.n).toLowerCase().includes(query.toLowerCase()));if(!items.length)return '';return `<div class="sectionhead"><div><h2>${g}</h2><p>${need[g]||'Marque os itens conforme os entrega.'}</p></div></div><div class="items">${items.map(({n,i})=>{let id=g+'|'+i;return `<div class="item">${icon(n)}<button onclick="detail('${esc(n)}','${esc(g)}')">${n}<small>Toque para saber como conseguir →</small></button><input type="checkbox" aria-label="Marcar ${n}" ${checked[id]?'checked':''} onchange="checked['${id}']=this.checked;localStorage.setItem('guia-checks',JSON.stringify(checked))"></div>`}).join('')}</div>`}).join('')||'<p>Nenhum item encontrado.</p>'}function detail(n,g){let season=g.match(/primavera|verão|outono|inverno/i)?.[0]||'Consulte a Wiki para épocas e condições';let name=english[n]||n.replace(/ \(.*/,'');document.querySelector('#dialogbody').innerHTML=`<div style="font-size:35px">${icon(n)}</div><h2>${n}</h2><p><b>Pacote:</b> ${g}<br><b>Estação:</b> ${season}</p><p>Consulte a página do item para locais, horários, condições e formas alternativas de obtenção no primeiro ano.</p><p><a href="${en}${encodeURIComponent(name.replaceAll(' ','_'))}" target="_blank">Abrir detalhes na Wiki ↗</a></p>`;document.querySelector('#dialog').showModal()}nav();render();
</script><script src="telemetry.js"></script><script src="visual.js"></script><script src="polish.js"></script><script src="acquisition.js"></script><script src="profile.js"></script><script src="time-format.js"></script><script src="embedded.js"></script><script src="realtime.js"></script></body></html>
